name: Generate Metrics
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Vishal31-hub
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          filename: metrics.svg
